plugins {
    id "java"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

import org.jetbrains.gradle.ext.Application

base.archivesName = project.mod_name
project.group = project.maven_group
project.version = "${project.mod_version}+${project.hytale_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

java {
    withSourcesJar()
    withJavadocJar()
}

apply from: "${project.rootDir}/gradle/build-logic/hytale.gradle"
apply from: "${project.rootDir}/gradle/build-logic/manifest.gradle"

// The IDEA extension type must be declared in the main build script because
// applied Gradle scripts do not have the plugin's classes on their compile classpath.
if (project.hytaleHome && project.file(project.hytaleHome).exists()) {
    idea.project.settings.runConfigurations {
        "HytaleServer"(Application) {
            def serverRunDir = project.file("${project.projectDir}/run")
            if (!serverRunDir.exists()) {
                serverRunDir.mkdirs()
            }

            mainClass = "com.hypixel.hytale.Main"
            moduleName = project.idea.module.name + ".main"
            programParameters = project.createServerRunArguments(project.layout.buildDirectory.dir("resources").get().asFile.absolutePath)
            workingDirectory = serverRunDir
        }
    }
} else {
    logger.lifecycle("Hytale installation not found; skipping the HytaleServer IntelliJ run configuration.")
}
